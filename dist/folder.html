<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FLOWER — Document Folder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
:root{--mint:#AEE3D8;--deep:#2F6F8F;--pink:#FA6B90;--bg:#FEFAFB;--card:#FFF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--deep);line-height:1.35;}
.container{max-width:480px;margin:24px auto;padding:24px;border-radius:28px;background:#fff;border:2px solid var(--mint);box-shadow:0 10px 30px rgba(47,111,143,.08);}
h1{font-weight:900;font-size:20px;letter-spacing:-.5px;margin-bottom:4px;color:var(--deep);}
.sub{font-size:11px;color:var(--deep)/70;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:#FDDEEC;color:var(--pink);font-weight:900;font-size:11px;margin-bottom:14px;}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F4F4F5;font-size:13px;font-weight:700;}
.doc-preview{margin-top:12px;border:2px dashed #FDDEEC;border-radius:16px;padding:12px;background:#FEFAFB;}
.doc-preview img{width:100%;max-height:320px;border-radius:12px;object-fit:contain;border:1px solid #FDDEEC;display:block;}
.doc-title{font-weight:900;font-size:14px;color:var(--deep);margin-top:8px;}
.doc-meta{font-size:11px;color:#777;margin-top:2px;}
.note{font-size:11px;color:#777;padding-top:10px;}
.loading{color:#777;font-size:11px;padding:12px;}
</style>
</head>
<body>
<div class="container">
  <div class="tag">FOLDER — SCANNED DOCUMENT</div>
  <h1 id="folder-title">Document Folder</h1>
  <p class="sub" id="folder-sub">Scan QR to open folder</p>

  <div class="row"><span>Folder ID</span> <b id="folder-id">—</b></div>
  <div class="row"><span>Category</span> <b id="folder-cat">—</b></div>
  <div class="row"><span>Label</span> <b id="folder-label">—</b></div>
  <div class="row"><span>Created / Scan Date</span> <b id="folder-date">—</b></div>

  <div id="doc-section" class="doc-preview" style="display:none;">
    <img id="doc-img" src="" alt="Scanned document" />
    <div class="doc-title" id="doc-title">Document</div>
    <div class="doc-meta" id="doc-meta">Scan • Medical Record</div>
  </div>
  <div id="doc-loading" class="loading">Loading scan data...</div>

  <p class="note">This folder is linked from the FLOWER app scan document system. If the image loads, you can long-press to save or share.</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('folderId');
if (id) {
  document.getElementById('folder-id').textContent = id.substring(0, 12) + (id.length > 12 ? '...' : '');
  document.getElementById('folder-title').textContent = 'Document Folder';
  document.getElementById('folder-sub').textContent = 'Loading from FLOWER server...';

  fetch(`/api/folder/${encodeURIComponent(id)}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('folder-sub').textContent = data.category ? ('Category: ' + data.category.replace(/_/g,' ')) : 'Scanned document';
      document.getElementById('folder-cat').textContent = data.category ? data.category.replace(/_/g,' ') : '—';
      document.getElementById('folder-label').textContent = data.title || '—';
      document.getElementById('folder-date').textContent = data.date || new Date().toLocaleDateString();
      document.getElementById('folder-title').textContent = data.title || ('Folder #' + id.substring(0,8));

      if (data.imageUrl || data.imageAttachment) {
        const img = document.getElementById('doc-img');
        const section = document.getElementById('doc-section');
        document.getElementById('doc-loading').style.display = 'none';
        img.src = data.imageUrl || data.imageAttachment;
        img.alt = data.title || 'Medical document scan';
        section.style.display = 'block';
        document.getElementById('doc-title').textContent = data.title || 'Document Scan';
        document.getElementById('doc-meta').textContent = (data.category ? data.category.replace(/_/g,' ') : 'Medical') + ' • ' + (data.date || new Date().toLocaleDateString()) + (data.week ? ' • Week ' + data.week : '');
      } else {
        document.getElementById('doc-loading').textContent = 'No image found for this folder.';
      }
    })
    .catch(() => {
      document.getElementById('doc-loading').textContent = 'Unable to load scan. Try opening inside the FLOWER app.';
    });
}
</script>
</body>
</html>
